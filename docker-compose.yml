name: zto-ai-assistant

services:
  app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
    image: zto-ai-assistant:latest
    container_name: zto-ai-assistant
    restart: unless-stopped
    environment:
      PORT: 8787
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-30}
      SSE_MAX_CONCURRENT: ${SSE_MAX_CONCURRENT:-100}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8787}:8787"
    volumes:
      - ./data:/data
