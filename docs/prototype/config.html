<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中通冷链 · 配置中台</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#F4F6F8;color:#303133;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.top{height:56px;padding:0 28px;background:#1F2D40;color:#fff;display:flex;align-items:center}.top b{font-size:16px;font-weight:500}.top span{margin-left:12px;color:#C2C8D3;font-size:12px}.cfgp{margin:24px auto;background:#fff;border:0.5px solid #E4E7ED;border-radius:8px;padding:22px;box-shadow:0 3px 12px rgba(31,45,64,.06)}.cfgp h3{margin:0;font-size:16px;font-weight:500}.rw{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #E4E7ED}.b{padding:7px 14px;border:0.5px solid #DCDFE6;background:#fff;color:#606266;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px}.b.pri{background:#00A6A6;border-color:#00A6A6;color:#fff}.b.pri:hover{background:#008C8C}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#303133;color:#fff;border-radius:4px;padding:9px 14px;font-size:13px;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
.cfgp{width:560px;max-width:92vw;max-height:82vh;overflow-y:auto}
.cftabs{display:flex;gap:6px;border-bottom:1px solid #E4E7ED;margin:10px 0 10px}
.cftabs button{border:none;background:none;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:#606266;border-bottom:2px solid transparent}
.cftabs button.on{color:#00A6A6;border-bottom-color:#00A6A6;font-weight:500}
.cftip{font-size:11px;color:#909399;background:#F5F7FA;border-radius:4px;padding:7px 9px;line-height:1.6;margin:0 0 8px}
.cfgp textarea{width:100%;box-sizing:border-box;border:0.5px solid #DCDFE6;border-radius:4px;padding:8px;font-size:12px;font-family:Consolas,Menlo,monospace;line-height:1.7;resize:vertical;color:#303133}
.cfgp textarea:focus{outline:none;border-color:#00A6A6}
.cfrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#606266;flex-wrap:wrap}
.cfrow b{color:#303133;font-weight:500}
.cfrow .tag{background:#F0F9EB;color:#67C23A;border:0.5px solid #C2E7B0;border-radius:10px;padding:1px 8px;font-size:11px}
.dynrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.dynrow input{flex:1;border:0.5px solid #DCDFE6;border-radius:4px;padding:6px 8px;font-size:12px;font-family:inherit;color:#303133}
.dynrow input:focus{outline:none;border-color:#00A6A6}
.dynrow .dlabel{width:74px;flex:none;font-size:12px;color:#606266;text-align:right}
.dynrow .dlabel.dl2{width:150px}
.dynrow button{border:none;background:none;color:#F56C6C;cursor:pointer;font-size:17px;line-height:1;padding:2px 6px;font-family:inherit}
.dynrow button:hover{color:#d43c3c}
.mini{margin-top:2px;padding:5px 12px;border:0.5px solid #DCDFE6;border-radius:4px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;color:#606266}
.mini:hover{border-color:#00A6A6;color:#00A6A6}
.mini.imp{border-color:#00A6A6;color:#00A6A6;background:#F0FBFB}
.mini.imp:hover{background:#E0F6F6}
.cfhint{font-size:11px;color:#909399}
#importprev{margin-top:8px;border:0.5px solid #DCDFE6;border-radius:6px;padding:9px 11px;background:#FAFDFD;font-size:12px;line-height:1.7;color:#303133}
#importprev .ip-t{font-weight:600;color:#00A6A6;margin-bottom:4px}
#importprev .ip-tag{display:inline-block;background:#F0F9EB;color:#67C23A;border:0.5px solid #C2E7B0;border-radius:10px;padding:0 8px;font-size:11px;margin-right:6px}
#importprev .ip-row{display:flex;align-items:center;gap:8px;margin-top:8px}
#importprev .ip-row button{padding:5px 14px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer}
#importprev .ip-ok{border:none;background:#00A6A6;color:#fff}
#importprev .ip-ok:hover{background:#009494}
#importprev .ip-no{border:0.5px solid #DCDFE6;background:#fff;color:#606266}
.cfempty{font-size:12px;color:#C0C4CC;text-align:center;padding:14px 0}
@media(max-width:680px){.top{padding:0 16px}.cfgp{margin:12px;padding:16px}.dynrow{flex-wrap:wrap}.dynrow .dlabel,.dynrow .dlabel.dl2{width:48px}.dynrow input{flex-basis:calc(100% - 64px)}}
</style>
</head>
<body>
<header class="top"><b>⚙ 配置中台</b><span>值班表、下载汇总、常见问题</span></header>
<main class="cfgp">
  <h3>⚙ 配置中台</h3>
  <div class="cftabs">
    <button class="on" data-t="duty" onclick="cfgTab('duty')">值班表</button>
    <button data-t="dl" onclick="cfgTab('dl')">下载汇总</button>
    <button data-t="faq" onclick="cfgTab('faq')">常见问题</button>
  </div>
  <div class="cftab" id="tab-duty">
    <p class="cftip">粘贴值班表，每行一条：<b>「周一：李勇,乔羽」</b>（按星期）或 <b>「2026-08-31：王五,赵六」</b>（按日期，优先于星期）。也可以直接粘贴 Excel 复制的内容（第一列日期/星期，其余列姓名），或整段 JSON。</p>
    <div class="cfrow"><button class="mini imp" onclick="importExcel()">📥 导入 Excel 值班表</button><span class="cfhint">支持 .xlsx / .xls，自动识别「排班主数据」「员工全月排班」表</span></div>
    <input type="file" id="excelfile" accept=".xlsx,.xls" style="display:none" onchange="onExcelFile(this)">
    <textarea id="dutytext" rows="6" placeholder="周一：李勇,乔羽,韩刚&#10;周二：张三,李四&#10;2026-08-31：王五,赵六&#10;…"></textarea>
    <div class="cfrow"><span>今日值班预览：</span><b id="dutynow">（尚未解析）</b></div>
    <div class="cfrow" style="margin-top:2px"><button class="mini" onclick="parseDuty()">解析预览</button></div>
    <div id="importprev" style="display:none"></div>
  </div>
  <div class="cftab" id="tab-dl" style="display:none">
    <p class="cftip">配置下载项：名称 + 真实文件链接（http/https），点击侧边栏按钮即打开/下载。链接留空则暂不可点。</p>
    <div id="dllist"></div>
    <button class="mini" onclick="addDlRow()">+ 添加下载项</button>
  </div>
  <div class="cftab" id="tab-faq" style="display:none">
    <p class="cftip">配置常见问题：问题 + 答案。点击侧边栏问题按钮时自动带入对话，回复内容取自答案（未配置答案时走 AI 生成）。</p>
    <div id="faqlist"></div>
    <button class="mini" onclick="addFaqRow()">+ 添加常见问题</button>
  </div>
  <div class="rw">
    <button class="b" onclick="closeCfg()">取消</button>
    <button class="b pri" onclick="saveSidebar()">保存配置</button>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
function escHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2200)}
var DEFAULT_SIDEBAR={
  onDuty:{byDate:{},byWeekday:{
    '周一':['李勇','乔羽','韩刚'],
    '周二':['李勇','乔羽'],
    '周三':['韩刚','乔羽'],
    '周四':['李勇','韩刚'],
    '周五':['李勇','乔羽','韩刚'],
    '周六':['乔羽'],
    '周日':[]
  }},
  downloads:[
    {name:'PDA下载',url:'',desc:'PDA 手持终端 V3.2.1'},
    {name:'鲸小宝(安卓)',url:'',desc:'Android 6.8.0'},
    {name:'鲸小宝(苹果)',url:'',desc:'iOS 6.8.0'}
  ],
  faq:[
    {q:'如何查询订单提货进度？',a:'可在「订单管理」中搜索订单编号查看运单状态，或点击运单行「详情」查看实时轨迹。'},
    {q:'温度异常怎么处理？',a:'系统检测到超温会触发预警（如页面顶部黄色条）。建议立即联系司机调温；若已影响品质可按 SOP 走理赔，也可点「一键转工单」转人工协助。'},
    {q:'PDA 无法登录怎么办？',a:'先检查网络与账号权限；仍无法登录可在右侧「下载汇总」重装 PDA 最新版，或联系今日在岗技术支持。'},
    {q:'如何申请退单？',a:'在「订单管理」勾选对应订单后点击上方「退单」，状态变为待确认后由财务审核，可在「退单工单」标签查看进度。'},
    {q:'签收异常如何操作？',a:'在运单「详情」中标记异常签收原因（拒收/部分签收等），系统会生成异常工单进入「异常工单」列表，由网点核实处理。'}
  ]
};
var SIDEBAR=JSON.parse(JSON.stringify(DEFAULT_SIDEBAR));
var WEEK_CN=['周日','周一','周二','周三','周四','周五','周六'];
function todayDuty(sb){
  var now=new Date(),p=function(n){return String(n).padStart(2,'0')};
  var ds=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate());
  var wk=WEEK_CN[now.getDay()];
  var bd=(sb.onDuty&&sb.onDuty.byDate)||{},bw=(sb.onDuty&&sb.onDuty.byWeekday)||{};
  return {date:ds,weekday:wk,staff:bd[ds]||bw[wk]||[]};
}
function mergeSidebar(c){
  c=c||{};
  var out=JSON.parse(JSON.stringify(DEFAULT_SIDEBAR));
  if(c.onDuty){out.onDuty.byDate=c.onDuty.byDate||{};if(c.onDuty.byWeekday)out.onDuty.byWeekday=c.onDuty.byWeekday;}
  if(Array.isArray(c.downloads)&&c.downloads.length)out.downloads=c.downloads;
  if(Array.isArray(c.faq)&&c.faq.length)out.faq=c.faq;
  return out;
}
/* ---- 配置弹窗 ---- */
function openCfg(){
  var sb=SIDEBAR;
  var txt=[];
  var bw=sb.onDuty.byWeekday||{},bd=sb.onDuty.byDate||{};
  WEEK_CN.slice(1).concat(['周日']).forEach(function(w){if(bw[w]&&bw[w].length)txt.push(w+'：'+bw[w].join(','))});
  Object.keys(bd).sort().forEach(function(d){if(bd[d].length)txt.push(d+'：'+bd[d].join(','))});
  document.getElementById('dutytext').value=txt.join('\n');
  var dlb=document.getElementById('dllist');dlb.innerHTML='';
  (sb.downloads||[]).forEach(function(x){addDlRow(x)});
  if(!(sb.downloads||[]).length)addDlRow();
  var fqb=document.getElementById('faqlist');fqb.innerHTML='';
  (sb.faq||[]).forEach(function(x){addFaqRow(x)});
  if(!(sb.faq||[]).length)addFaqRow();
  parseDuty();
}
function closeCfg(){location.href='/'}
function cfgTab(t){
  var tabs=document.querySelectorAll('.cftabs button');
  for(var i=0;i<tabs.length;i++)tabs[i].className=tabs[i].getAttribute('data-t')===t?'on':'';
  ['duty','dl','faq'].forEach(function(k){document.getElementById('tab-'+k).style.display=k===t?'':'none'});
}
/* ---- 值班表解析：支持「周X：人名」/「日期：人名」/ Excel 粘贴 / JSON ---- */
function parseDutyText(text){
  var byDate={},byWeekday={};
  var t=(text||'').trim();
  if(!t)return {byDate:byDate,byWeekday:byWeekday};
  if(t.charAt(0)==='{'){
    try{var j=JSON.parse(t);if(j.byDate)byDate=j.byDate;if(j.byWeekday)byWeekday=j.byWeekday;return {byDate:byDate,byWeekday:byWeekday};}catch(e){}
  }
  t.split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    var m=line.match(/^\s*([^：:]+)\s*[：:]\s*(.+)$/),key,val;
    if(m){key=m[1].trim();val=m[2];}
    else{
      var parts=line.split(/[\t\s]+/).filter(Boolean);
      if(parts.length>=2){key=parts[0];val=parts.slice(1).join(',');}
      else return;
    }
    if(!key||!val)return;
    var names=val.split(/[,，、;；\s]+/).filter(Boolean);
    if(!names.length)return;
    if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(key)){
      var dm=key.replace(/\//g,'-').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      byDate[dm[1]+'-'+('0'+dm[2]).slice(-2)+'-'+('0'+dm[3]).slice(-2)]=names;
    }else{
      var wk=key.replace('星期','周').replace('礼拜','周').replace('周天','周日');
      byWeekday[wk]=names;
    }
  });
  return {byDate:byDate,byWeekday:byWeekday};
}
function parseDuty(){
  var r=parseDutyText(document.getElementById('dutytext').value);
  var t=todayDuty({onDuty:r});
  var el=document.getElementById('dutynow');
  el.innerHTML=t.staff.length
    ? escHtml(t.staff.join('、'))+' <span class="tag">'+t.weekday+' '+t.date+'</span>'
    : '（今日 '+t.weekday+' '+t.date+' 无匹配值班）';
  document.getElementById('dutytext').setAttribute('data-ok',t.staff.length?'1':'0');
}
/* ---- 下载 / FAQ 动态行 ---- */
function addDlRow(x){
  x=x||{};
  var row=document.createElement('div');row.className='dynrow';
  row.innerHTML='<span class="dlabel dl2">名称</span><input class="nm" placeholder="如：PDA下载" value="'+escHtml(x.name||'')+'"><span class="dlabel">链接</span><input class="ur" placeholder="https://…（留空则不可点）" value="'+escHtml(x.url||'')+'"><button onclick="this.parentNode.remove()">✕</button>';
  document.getElementById('dllist').appendChild(row);
}
function addFaqRow(x){
  x=x||{};
  var row=document.createElement('div');row.className='dynrow';
  row.innerHTML='<span class="dlabel dl2">问题</span><input class="q" placeholder="如：如何查询订单提货进度？" value="'+escHtml(x.q||'')+'"><span class="dlabel">答案</span><input class="a" placeholder="点击后回复内容（留空走 AI）" value="'+escHtml(x.a||'')+'"><button onclick="this.parentNode.remove()">✕</button>';
  document.getElementById('faqlist').appendChild(row);
}
/* ---- 保存 ---- */
function collectCfg(){
  var r=parseDutyText(document.getElementById('dutytext').value);
  var dls=[],drows=document.querySelectorAll('#dllist .dynrow');
  for(var i=0;i<drows.length;i++){
    var nm=drows[i].querySelector('.nm').value.trim(),ur=drows[i].querySelector('.ur').value.trim();
    if(nm)dls.push({name:nm,url:ur});
  }
  var fqs=[],frows=document.querySelectorAll('#faqlist .dynrow');
  for(var j=0;j<frows.length;j++){
    var q=frows[j].querySelector('.q').value.trim(),a=frows[j].querySelector('.a').value.trim();
    if(q)fqs.push({q:q,a:a});
  }
  return {onDuty:r,downloads:dls,faq:fqs};
}
function saveSidebar(){
  var cfg=collectCfg();
  fetch('/api/sidebar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:cfg})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){SIDEBAR=mergeSidebar(d.config);openCfg();toast('配置已保存并生效');}
      else toast('保存失败：'+(d.error||'未知错误'));
    }).catch(function(){
      try{localStorage.setItem('zt_sidebar',JSON.stringify(cfg));}catch(e){}
      SIDEBAR=mergeSidebar(cfg);openCfg();toast('已保存到本地（代理未连接，重启后仍有效）');
    });
}
/* ---- 值班表 Excel 导入 ---- */
function importExcel(){document.getElementById('excelfile').click()}
function onExcelFile(inp){
  var f=inp.files[0];inp.value='';
  if(!f)return;
  if(!/\.(xlsx|xls)$/i.test(f.name)){toast('仅支持 .xlsx / .xls 格式');return}
  if(f.size>8*1024*1024){toast('文件过大（限 8MB）');return}
  var rd=new FileReader();
  rd.onload=function(){
    var b64=(rd.result||'').split(',')[1]||'';
    toast('正在解析值班表…');
    fetch('/api/sidebar/import-excel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,base64:b64})})
      .then(function(r){return r.json()}).then(function(d){
        if(!d.ok){toast('解析失败：'+(d.error||'未知错误'));return}
        showImportPreview(d);
      }).catch(function(){toast('导入失败：代理服务未连接')});
  };
  rd.readAsDataURL(f);
}
function cnWeek(ds){
  return '周'+'日一二三四五六'[new Date(ds).getDay()];
}
function showImportPreview(d){
  var m=d.meta,od=d.onDuty;
  var today=todayStr();
  var wk=cnWeek(today);
  var staff=(od.byDate[today]||od.byWeekday[wk]||od.byWeekday['星期'+wk.slice(1)]||[]).join('、')||'（无）';
  var el=document.getElementById('importprev');
  el.style.display='block';
  el.innerHTML='<div class="ip-t">📋 解析成功（'+escHtml(d.usedSheet||'工作表')+'）</div>'+
    '<div>识别到 <b>'+m.staffCount+'</b> 名员工（'+escHtml(m.staff.join('、'))+'），排班记录 <b>'+m.records+'</b> 条（含休息 '+m.restRecords+' 条），覆盖 <b>'+m.dateFrom+' ~ '+m.dateTo+'</b>，共 '+m.dutyDates+' 个在岗日。</div>'+
    '<div>📅 今日（'+today+' '+cnWeek(today)+'）值班：<b>'+escHtml(staff)+'</b></div>'+
    '<div class="ip-row"><button class="ip-ok" onclick="applyImport()">✓ 应用并保存</button><button class="ip-no" onclick="cancelImport()">取消</button></div>';
  window._impDuty=od;
}
function cancelImport(){document.getElementById('importprev').style.display='none';window._impDuty=null}
function applyImport(){
  var od=window._impDuty;if(!od)return;
  var cur=parseDutyText(document.getElementById('dutytext').value);
  // 归一化 Excel 的 byWeekday 键（星期一→周一）并覆盖同名旧键
  var exc=od.byWeekday||{},norm={};
  Object.keys(exc).forEach(function(k){
    var nk=k.replace('星期','周').replace('礼拜','周').replace('周天','周日');
    norm[nk]=exc[k];
  });
  var merged={byDate:Object.assign({},cur.byDate,od.byDate),byWeekday:Object.assign({},cur.byWeekday,norm)};
  document.getElementById('dutytext').value=Object.keys(merged.byDate).sort().map(function(k){return k+'：'+merged.byDate[k].join(',')}).join('\n');
  var cfg=collectCfg();cfg.onDuty=merged;
  fetch('/api/sidebar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:cfg})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){SIDEBAR=mergeSidebar(d.config);openCfg();toast('值班表已导入并生效');}
      else toast('保存失败：'+(d.error||'未知错误'));
    }).catch(function(){
      try{localStorage.setItem('zt_sidebar',JSON.stringify(cfg));}catch(e){}
      SIDEBAR=mergeSidebar(cfg);openCfg();toast('已保存到本地（代理未连接，重启后仍有效）');
    });
  window._impDuty=null;
}
function todayStr(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}

function loadConfigPage(){
  fetch('/api/sidebar').then(function(r){return r.json()}).then(function(d){
    if(d.success&&d.config) SIDEBAR=mergeSidebar(d.config);
    openCfg();
  }).catch(function(){openCfg();toast('未读取到服务器配置，当前显示默认值')});
}
loadConfigPage();
</script>
</body>
</html>
